<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt Chart - Compacto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--surface3:#2e3345;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent3:#fd79a8;
  --text:#e8e8f0;--text2:#9ca3b0;--text3:#636b78;
  --success:#00cec9;--warn:#fdcb6e;--border:#2e3345;
  /* Redução da Grid: Altura de 44px -> 34px | Largura de 38px -> 30px */
  --row-h:34px;
  --col-w:30px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:auto}

/* HEADER */
.header{
  background:linear-gradient(135deg,#1a1d27 0%,#242836 100%);
  border-bottom:1px solid var(--border);padding:15px 30px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;
}
.header-left h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.header-left p{color:var(--text2);font-size:12px;margin-top:2px}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.control-group{display:flex;flex-direction:column;gap:2px}
.control-group label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.control-group input[type="date"],.control-group input[type="file"]{
  background:var(--surface3);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:6px;font-family:'Inter',sans-serif;font-size:12px;
  transition:all .2s;cursor:pointer;
}
.btn{
  background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;
  border:none;padding:8px 18px;border-radius:6px;font-family:'Inter',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;transition:all .25s;
}

/* STATS BAR */
.stats-bar{display:flex;gap:20px;padding:10px 30px;border-bottom:1px solid var(--border);background:var(--surface)}
.stat{display:flex;align-items:center;gap:8px}
.stat-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.stat-icon.purple{background:rgba(108,92,231,.15);color:var(--accent2)}
.stat-icon.pink{background:rgba(253,121,168,.15);color:var(--accent3)}
.stat-icon.teal{background:rgba(0,206,201,.15);color:var(--success)}
.stat-info .stat-val{font-size:16px;font-weight:700;display:block}
.stat-info .stat-lbl{font-size:10px;color:var(--text2);display:block}

/* GANTT CONTAINER */
.gantt-wrapper{display:flex;overflow:auto;position:relative;max-height:calc(100vh - 160px)}
.task-list{min-width:450px;max-width:450px;border-right:2px solid var(--border);background:var(--surface);z-index:2;position:sticky;left:0}
.chart-area{flex:1;overflow-x:auto;position:relative}

/* TABLE HEADER */
.tl-header{
  display:grid;grid-template-columns:36px 1fr 45px 50px 50px;
  padding:0 10px;height:var(--row-h);align-items:center;
  background:var(--surface2);border-bottom:1px solid var(--border);
  font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;
  position:sticky;top:0;z-index:3;
}
.tl-row{
  display:grid;grid-template-columns:36px 1fr 45px 50px 50px;
  padding:0 10px;height:var(--row-h);align-items:center;
  border-bottom:1px solid var(--border);font-size:12px;
}
.tl-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}

/* CHART HEADER */
.ch-month-row{display:flex;height:20px;position:sticky;top:0;z-index:1;background:var(--surface2)}
.ch-month{font-size:10px;font-weight:700;color:var(--accent2);display:flex;align-items:center;padding-left:6px;border-left:1px solid var(--border);border-bottom:1px solid var(--border)}
.ch-header{display:flex;height:20px;position:sticky;top:20px;z-index:1;background:var(--surface2)}
.ch-day{
  min-width:var(--col-w);max-width:var(--col-w);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9px;font-weight:600;color:var(--text3);
  border-left:1px solid var(--border);border-bottom:1px solid var(--border);
}
.ch-day.weekend{background:rgba(253,121,168,.04);color:var(--accent3)}

/* CHART ROWS */
.ch-row{display:flex;height:var(--row-h);position:relative;border-bottom:1px solid var(--border)}
.ch-cell{min-width:var(--col-w);max-width:var(--col-w);border-left:1px solid rgba(46,51,69,.3)}

/* BARS & MILESTONES */
.bar{
  position:absolute;top:7px;height:20px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;
  z-index:1;min-width:18px;overflow:hidden;
  background:var(--surface3); border:1px solid rgba(255,255,255,0.1);
}
.milestone {
  position:absolute;top:10px;width:14px;height:14px;
  background:var(--accent3); transform: rotate(45deg);
  border: 1px solid #fff; z-index: 1;
}
.bar-progress{position:absolute;left:0;top:0;bottom:0;border-radius:3px;z-index:0}
.bar-label{position:relative;z-index:1;padding:0 3px}

.dep-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
.tooltip{
  position:fixed;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;pointer-events:none;z-index:100;
  box-shadow:0 8px 25px rgba(0,0,0,.5);display:none;font-size:11px;
}
.today-line{position:absolute;top:0;width:1px;background:var(--success);z-index:2;opacity:.5}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1 id="projectTitle">Projeto OnFly</h1>
    <p>Gráfico de Gantt Compacto</p>
  </div>
  <div class="controls">
    <div class="control-group">
      <label>Início</label>
      <input type="date" id="startDate" value="2026-05-04">
    </div>
    <div class="control-group">
      <label>CSV</label>
      <input type="file" id="csvFile" accept=".csv">
    </div>
    <button class="btn" onclick="reload()">Atualizar</button>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-icon purple">📋</div><div class="stat-info"><span class="stat-val" id="statTasks">0</span><span class="stat-lbl">Tarefas</span></div></div>
  <div class="stat"><div class="stat-icon pink">📅</div><div class="stat-info"><span class="stat-val" id="statDays">0</span><span class="stat-lbl">Dias</span></div></div>
  <div class="stat"><div class="stat-icon teal">🏁</div><div class="stat-info"><span class="stat-val" id="statEnd">--</span><span class="stat-lbl">Fim</span></div></div>
</div>

<div class="gantt-wrapper" id="ganttWrapper"></div>
<div class="tooltip" id="tooltip"></div>

<script>
const BAR_COLORS = ['linear-gradient(135deg,#6c5ce7,#a29bfe)','linear-gradient(135deg,#fd79a8,#fab1a0)','linear-gradient(135deg,#00cec9,#81ecec)','linear-gradient(135deg,#fdcb6e,#ffeaa7)'];
const COL_W = 30, ROW_H = 34;
const MONTHS_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DAYS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

let tasks = [], projectStart = null, allDays = [], fileContent = null;

function parseDate(s){ const d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function isWeekend(d){ const w=d.getDay(); return w===0||w===6; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addBusinessDays(start, n){
  let d = new Date(start), count = 0;
  if(n <= 0) return d;
  while(count < n){ d = addDays(d,1); if(!isWeekend(d)) count++; }
  return d;
}
function businessDayIndex(day, origin){
  let idx=0, d=new Date(origin);
  while(d < day){ d=addDays(d,1); idx++; }
  return idx;
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const delim = lines[0].includes(';') ? ';' : ',';
  const headers = lines[0].split(delim).map(h=>h.trim().toLowerCase());
  const result = [];
  for(let i=1;i<lines.length;i++){
    const vals = lines[i].split(delim).map(v=>v.trim());
    if(vals.length<2) continue;
    const obj={};
    headers.forEach((h,j)=> obj[h]=vals[j]||'');
    result.push({
      id: parseInt(obj.id)||i,
      task: obj.task || obj.tarefa || obj.name || 'Tarefa '+i,
      percent: parseInt(obj.percent || obj.concluido || 0),
      duration: parseInt(obj.duration || obj.dias || 0),
      predecessor: obj.predecessor || '',
      type: (obj.type || 'FS').toUpperCase()
    });
  }
  return result;
}

function calculateSchedule(tasks, start){
  const map = {};
  tasks.forEach(t=>{ t.start=null; t.end=null; map[t.id]=t; });
  function resolve(t){
    if(t.start) return;
    if(!t.predecessor || !map[parseInt(t.predecessor)]){
      t.start = new Date(start);
    } else {
      const pred = map[parseInt(t.predecessor)];
      resolve(pred);
      t.start = t.type==='SS' ? new Date(pred.start) : addBusinessDays(pred.start, pred.duration);
    }
    while(isWeekend(t.start)) t.start = addDays(t.start,1);
    t.end = t.duration === 0 ? new Date(t.start) : addBusinessDays(t.start, t.duration - 1);
  }
  tasks.forEach(resolve);
}

function render(){
  const wrapper = document.getElementById('ganttWrapper');
  wrapper.innerHTML = '';
  if(!tasks.length) return;

  document.getElementById('statTasks').textContent = tasks.length;
  document.getElementById('statDays').textContent = businessDayIndex(tasks[tasks.length-1].end, tasks[0].start)+1;
  document.getElementById('statEnd').textContent = tasks[tasks.length-1].end.toLocaleDateString();

  const tl = document.createElement('div'); tl.className='task-list';
  const tlh = document.createElement('div'); tlh.className='tl-header';
  tlh.innerHTML='<span>#</span><span>Tarefa</span><span>%</span><span>Dias</span><span>Pred</span>';
  tl.appendChild(tlh);
  tasks.forEach(t=> {
    const r=document.createElement('div'); r.className='tl-row';
    r.innerHTML=`<span>${t.id}</span><span class="name" title="${t.task}">${t.task}</span><span>${t.duration===0?'-':t.percent+'%'}</span><span style="color:var(--accent2)">${t.duration}d</span><span>${t.predecessor||'-'}</span>`;
    tl.appendChild(r);
  });

  const ca = document.createElement('div'); ca.className='chart-area';
  const mRow = document.createElement('div'); mRow.className='ch-month-row';
  let curM = -1, mSpan = null;
  allDays.forEach(d=> {
    if(d.getMonth()!==curM){
      if(mSpan) mRow.appendChild(mSpan);
      mSpan=document.createElement('div'); mSpan.className='ch-month';
      mSpan.textContent=MONTHS_PT[d.getMonth()]+' '+d.getFullYear();
      mSpan.style.minWidth=COL_W+'px'; curM=d.getMonth();
    } else { mSpan.style.minWidth=(parseInt(mSpan.style.minWidth)+COL_W)+'px'; }
  });
  mRow.appendChild(mSpan); ca.appendChild(mRow);

  const dh = document.createElement('div'); dh.className='ch-header';
  const today = new Date(); today.setHours(0,0,0,0);
  allDays.forEach(d=> {
    const cell=document.createElement('div'); cell.className='ch-day';
    if(isWeekend(d)) cell.classList.add('weekend');
    cell.innerHTML=`<span>${DAYS_PT[d.getDay()].charAt(0)}</span><span>${d.getDate()}</span>`;
    dh.appendChild(cell);
  });
  ca.appendChild(dh);

  const rowsContainer = document.createElement('div'); rowsContainer.style.position='relative';
  tasks.forEach((t,i)=> {
    const row=document.createElement('div'); row.className='ch-row';
    allDays.forEach(d=> {
      const c=document.createElement('div'); c.className='ch-cell';
      if(isWeekend(d)) c.classList.add('weekend'); row.appendChild(c);
    });
    const sIdx = businessDayIndex(t.start, allDays[0]);
    if(t.duration===0){
      const ms=document.createElement('div'); ms.className='milestone';
      ms.style.left=(sIdx*COL_W + COL_W/2 - 7)+'px'; row.appendChild(ms);
    } else {
      const eIdx = businessDayIndex(t.end, allDays[0]);
      const bar=document.createElement('div'); bar.className='bar';
      bar.style.left=(sIdx*COL_W+2)+'px'; bar.style.width=((eIdx-sIdx+1)*COL_W-4)+'px';
      const p=document.createElement('div'); p.className='bar-progress';
      p.style.width=t.percent+'%'; p.style.background=BAR_COLORS[i%BAR_COLORS.length];
      bar.appendChild(p); bar.innerHTML+=`<span class="bar-label">${t.percent}%</span>`;
      row.appendChild(bar);
    }
    rowsContainer.appendChild(row);
  });
  ca.appendChild(rowsContainer); wrapper.appendChild(tl); wrapper.appendChild(ca);
}

function reload(){ if(fileContent) { tasks=parseCSV(fileContent); projectStart=parseDate(document.getElementById('startDate').value); calculateSchedule(tasks, projectStart); allDays=[]; let d=new Date(tasks[0].start); d=addDays(d,-2); let max=new Date(tasks[tasks.length-1].end); max=addDays(max,5); while(d<=max){allDays.push(new Date(d)); d=addDays(d,1);} render(); } }

document.getElementById('csvFile').addEventListener('change', e=> {
  const f=e.target.files[0]; const reader=new FileReader();
  reader.onload=ev=>{ fileContent=ev.target.result; reload(); }; reader.readAsText(f);
});
document.getElementById('startDate').addEventListener('change', reload);
</script>
</body>
</html>

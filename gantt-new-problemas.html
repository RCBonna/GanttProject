<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--surface3:#2e3345;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent3:#fd79a8;
  --text:#e8e8f0;--text2:#9ca3b0;--text3:#636b78;
  --success:#00cec9;--warn:#fdcb6e;--border:#2e3345;--danger:#ff7675;
  --row-h:44px;--col-w:38px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:auto}

/* BARS */
.bar{
  position:absolute;top:10px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
  z-index:1;min-width:24px;overflow:hidden;
  background:var(--surface3);
  border:1px solid rgba(255,255,255,0.1);
}
.bar.critical{background:var(--danger)}

.bar-progress{
  position:absolute;left:0;top:0;bottom:0;border-radius:4px;
}

.milestone{
  position:absolute;width:18px;height:18px;
  transform:rotate(45deg);
  top:13px;z-index:2;cursor:pointer;
  background:var(--accent3);
  border:1px solid rgba(255,255,255,0.2);
}
.milestone.critical{background:var(--danger)}

</style>
</head>
<body>

<div id="chart"></div>

<script>
const COL_W = 38;

let tasks = [
  {id:1,task:"Início",duration:0,start:0,critical:true},
  {id:2,task:"Planejamento",duration:3,start:1},
  {id:3,task:"Marco Importante",duration:0,start:5,critical:true},
  {id:4,task:"Execução",duration:5,start:6,critical:true}
];

function render(){
  const chart = document.getElementById('chart');

  tasks.forEach((t,i)=>{
    const row=document.createElement('div');
    row.style.position='relative';
    row.style.height='44px';
    row.style.borderBottom='1px solid #2e3345';

    // grid
    for(let d=0; d<30; d++){
      const c=document.createElement('div');
      c.style.display='inline-block';
      c.style.width='38px';
      c.style.height='44px';
      c.style.borderLeft='1px solid #222';
      row.appendChild(c);
    }

    if(t.duration === 0){
      const m = document.createElement('div');
      m.className='milestone';
      if(t.critical) m.classList.add('critical');
      m.style.left = (t.start * COL_W + COL_W/2 - 9)+'px';
      row.appendChild(m);
    } else {
      const b=document.createElement('div');
      b.className='bar';
      if(t.critical) b.classList.add('critical');
      b.style.left = (t.start * COL_W)+'px';
      b.style.width = (t.duration * COL_W)+'px';

      const p=document.createElement('div');
      p.className='bar-progress';
      p.style.width='50%';
      p.style.background='#6c5ce7';
      b.appendChild(p);

      row.appendChild(b);
    }

    const label=document.createElement('div');
    label.textContent = t.task;
    label.style.position='absolute';
    label.style.left='0px';
    label.style.top='0px';
    label.style.fontSize='12px';
    row.appendChild(label);

    chart.appendChild(row);
  });
}

render();
</script>

</body>
</html>

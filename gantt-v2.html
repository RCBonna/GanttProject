<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt Chart - Roberto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--surface3:#2e3345;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent3:#fd79a8;
  --text:#e8e8f0;--text2:#9ca3b0;--text3:#636b78;
  --success:#00cec9;--warn:#fdcb6e;--border:#2e3345;
  --row-h:44px;--col-w:38px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:auto}

/* HEADER */
.header{
  background:linear-gradient(135deg,#1a1d27 0%,#242836 100%);
  border-bottom:1px solid var(--border);padding:28px 40px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;
}
.header-left h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.header-left p{color:var(--text2);font-size:13px;margin-top:4px}
.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.control-group{display:flex;flex-direction:column;gap:4px}
.control-group label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.control-group input[type="date"],.control-group input[type="file"]{
  background:var(--surface3);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;
  transition:all .2s;cursor:pointer;
}
.control-group input:hover{border-color:var(--accent)}
.control-group input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.2)}
.btn{
  background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;
  border:none;padding:10px 22px;border-radius:8px;font-family:'Inter',sans-serif;
  font-size:13px;font-weight:600;cursor:pointer;transition:all .25s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,92,231,.35)}

/* STATS BAR */
.stats-bar{display:flex;gap:24px;padding:16px 40px;border-bottom:1px solid var(--border);background:var(--surface)}
.stat{display:flex;align-items:center;gap:8px}
.stat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.stat-icon.purple{background:rgba(108,92,231,.15);color:var(--accent2)}
.stat-icon.pink{background:rgba(253,121,168,.15);color:var(--accent3)}
.stat-icon.teal{background:rgba(0,206,201,.15);color:var(--success)}
.stat-info span{display:block}
.stat-info .stat-val{font-size:18px;font-weight:700}
.stat-info .stat-lbl{font-size:11px;color:var(--text2)}

/* GANTT CONTAINER */
.gantt-wrapper{display:flex;overflow:auto;position:relative;max-height:calc(100vh - 200px)}
/* Aumentado de 340px para 450px para mostrar mais da descrição */
.task-list{min-width:450px;max-width:450px;border-right:2px solid var(--border);background:var(--surface);z-index:2;position:sticky;left:0}
.chart-area{flex:1;overflow-x:auto;position:relative}

/* TABLE HEADER */
.tl-header{
  display:grid;grid-template-columns:36px 1fr 40px 45px 45px;
  padding:0 12px;height:var(--row-h);align-items:center;
  background:var(--surface2);border-bottom:1px solid var(--border);
  font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;
  position:sticky;top:0;z-index:3;
}
.tl-row{
  display:grid;grid-template-columns:36px 1fr 40px 45px 45px;
  padding:0 12px;height:var(--row-h);align-items:center;
  border-bottom:1px solid var(--border);font-size:13px;
  transition:background .15s;cursor:default;
}
.tl-row:hover{background:var(--surface2)}
.tl-row .id{color:var(--text3);font-weight:600;font-size:12px}
.tl-row .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.tl-row .dur{color:var(--accent2);font-weight:600;text-align:center;font-size:12px}
.tl-row .pred{color:var(--text3);font-size:12px;text-align:center}

/* CHART HEADER (dates) */
.ch-month-row{display:flex;height:22px;position:sticky;top:0;z-index:1;background:var(--surface2)}
.ch-month{font-size:11px;font-weight:700;color:var(--accent2);display:flex;align-items:center;padding-left:6px;border-left:1px solid var(--border);border-bottom:1px solid var(--border)}
.ch-header{display:flex;height:22px;position:sticky;top:22px;z-index:1;background:var(--surface2)}
.ch-day{
  min-width:var(--col-w);max-width:var(--col-w);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;color:var(--text3);
  border-left:1px solid var(--border);border-bottom:1px solid var(--border);
}
.ch-day.weekend{background:rgba(253,121,168,.04);color:var(--accent3)}
.ch-day.today{background:rgba(0,206,201,.1);color:var(--success)}

/* CHART ROWS */
.ch-row{display:flex;height:var(--row-h);position:relative;border-bottom:1px solid var(--border)}
.ch-cell{min-width:var(--col-w);max-width:var(--col-w);border-left:1px solid rgba(46,51,69,.5)}
.ch-cell.weekend{background:rgba(253,121,168,.03)}

/* BARS & MILESTONES */
.bar{
  position:absolute;top:10px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
  transition:all .2s;cursor:pointer;z-index:1;
  min-width:24px;overflow:hidden;
  background:var(--surface3);
  border:1px solid rgba(255,255,255,0.1);
}
.milestone {
  position:absolute;top:12px;width:18px;height:18px;
  background:var(--accent3);
  transform: rotate(45deg);
  border: 1px solid #fff;
  z-index: 1;
  cursor: pointer;
}
.bar:hover, .milestone:hover{filter:brightness(1.15);transform:scale(1.1)}
.milestone:hover{transform:rotate(45deg) scale(1.2)}

.bar-progress{
  position:absolute;left:0;top:0;bottom:0;
  border-radius:4px;
  z-index:0;
  transition:width 0.3s ease;
}
.bar-label{
  position:relative;z-index:1;
  text-shadow:0 1px 2px rgba(0,0,0,0.5);
  padding:0 4px;
}

/* DEPENDENCY ARROWS */
.dep-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:0}

/* TOOLTIP */
.tooltip{
  position:fixed;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px;pointer-events:none;z-index:100;
  box-shadow:0 12px 40px rgba(0,0,0,.5);display:none;max-width:280px;
}
.tooltip h4{font-size:14px;font-weight:700;margin-bottom:6px;color:var(--accent2)}
.tooltip p{font-size:12px;color:var(--text2);line-height:1.5}
.tooltip .tt-row{display:flex;justify-content:space-between;gap:16px}
.tooltip .tt-val{color:var(--text);font-weight:600}

/* SCROLLBAR */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.today-line{position:absolute;top:0;width:2px;background:var(--success);z-index:2;opacity:.6}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1 id="projectTitle">Projeto OnFly - Fase 1</h1>
    <p>Gráfico de Gantt &mdash; Planejamento Visual</p>
  </div>
  <div class="controls">
    <div class="control-group">
      <label>Data de Início</label>
      <input type="date" id="startDate" value="2026-05-04">
    </div>
    <div class="control-group">
      <label>Arquivo CSV</label>
      <input type="file" id="csvFile" accept=".csv">
    </div>
    <button class="btn" onclick="reload()">Atualizar</button>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-icon purple">📋</div><div class="stat-info"><span class="stat-val" id="statTasks">0</span><span class="stat-lbl">Tarefas</span></div></div>
  <div class="stat"><div class="stat-icon pink">📅</div><div class="stat-info"><span class="stat-val" id="statDays">0</span><span class="stat-lbl">Dias Úteis</span></div></div>
  <div class="stat"><div class="stat-icon teal">🏁</div><div class="stat-info"><span class="stat-val" id="statEnd">--</span><span class="stat-lbl">Conclusão</span></div></div>
</div>

<div class="gantt-wrapper" id="ganttWrapper">
  <div class="empty-state" id="emptyState" style="padding: 80px; text-align: center;">
    <h2>Nenhum projeto carregado</h2>
    <p>Selecione um arquivo CSV para visualizar o cronograma.</p>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const BAR_COLORS = [
  'linear-gradient(135deg,#6c5ce7,#a29bfe)','linear-gradient(135deg,#fd79a8,#fab1a0)',
  'linear-gradient(135deg,#00cec9,#81ecec)','linear-gradient(135deg,#fdcb6e,#ffeaa7)',
  'linear-gradient(135deg,#e17055,#fab1a0)','linear-gradient(135deg,#0984e3,#74b9ff)',
  'linear-gradient(135deg,#00b894,#55efc4)','linear-gradient(135deg,#e84393,#fd79a8)',
];
const COL_W = 38, ROW_H = 44;
const MONTHS_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DAYS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

let tasks = [], projectStart = null, allDays = [], fileContent = null;

function parseDate(s){ const d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function isWeekend(d){ const w=d.getDay(); return w===0||w===6; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDate(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }

function addBusinessDays(start, n){
  let d = new Date(start), count = 0;
  if(n <= 0) return d;
  while(count < n){ d = addDays(d,1); if(!isWeekend(d)) count++; }
  return d;
}
function businessDayIndex(day, origin){
  let idx=0, d=new Date(origin);
  while(d < day){ d=addDays(d,1); idx++; }
  return idx;
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const delim = lines[0].includes(';') ? ';' : ',';
  const headers = lines[0].split(delim).map(h=>h.trim().toLowerCase());
  const result = [];
  for(let i=1;i<lines.length;i++){
    const vals = lines[i].split(delim).map(v=>v.trim());
    if(vals.length<2) continue;
    const obj={};
    headers.forEach((h,j)=> obj[h]=vals[j]||'');
    result.push({
      id: parseInt(obj.id)||i,
      task: obj.task || obj.tarefa || obj.name || 'Tarefa '+i,
      percent: parseInt(obj.percent || obj.concluido || obj.progresso || 0),
      duration: parseInt(obj.duration || obj.duracao || obj.dias || 0),
      predecessor: obj.predecessor || obj.predecessora || '',
      type: (obj.type || obj.tipo || 'FS').toUpperCase()
    });
  }
  return result;
}

function calculateSchedule(tasks, start){
  const map = {};
  tasks.forEach(t=>{ t.start=null; t.end=null; map[t.id]=t; });

  function resolve(t){
    if(t.start) return;
    if(!t.predecessor || !map[parseInt(t.predecessor)]){
      t.start = new Date(start);
    } else {
      const pred = map[parseInt(t.predecessor)];
      resolve(pred);
      if(t.type==='SS'){
        t.start = new Date(pred.start);
      } else {
        t.start = addBusinessDays(pred.start, pred.duration);
      }
    }
    while(isWeekend(t.start)) t.start = addDays(t.start,1);
    // Para duração 0, end é igual ao start
    t.end = t.duration === 0 ? new Date(t.start) : addBusinessDays(t.start, t.duration - 1);
  }
  tasks.forEach(resolve);
}

function buildCalendar(tasks){
  let minD = tasks[0].start, maxD = tasks[0].end;
  tasks.forEach(t=>{
    if(t.start<minD) minD=new Date(t.start);
    if(t.end>maxD) maxD=new Date(t.end);
  });
  minD = addDays(minD, -2);
  maxD = addDays(maxD, 5);
  const days=[];
  let d = new Date(minD);
  while(d<=maxD){ days.push(new Date(d)); d=addDays(d,1); }
  return days;
}

function render(){
  const wrapper = document.getElementById('ganttWrapper');
  wrapper.innerHTML = '';
  if(!tasks.length) return;

  document.getElementById('statTasks').textContent = tasks.length;
  document.getElementById('statDays').textContent = businessDayIndex(tasks[tasks.length-1].end, tasks[0].start)+1;
  document.getElementById('statEnd').textContent = fmtDate(tasks[tasks.length-1].end);

  const tl = document.createElement('div'); tl.className='task-list';
  const tlh = document.createElement('div'); tlh.className='tl-header';
  tlh.innerHTML='<span>#</span><span>Tarefa</span><span>%</span><span>Dias</span><span>Pred</span>';
  tl.appendChild(tlh);
  
  tasks.forEach(t=>{
    const r=document.createElement('div'); r.className='tl-row';
    const pctColor = t.percent === 100 ? 'var(--success)' : (t.percent > 0 ? 'var(--warn)' : 'var(--text3)');
    r.innerHTML=`<span class="id">${t.id}</span>
      <span class="name" title="${t.task}">${t.task}</span>
      <span style="font-size:11px; font-weight:700; color:${pctColor}">${t.duration === 0 ? '-' : t.percent+'%'}</span>
      <span class="dur">${t.duration}d</span>
      <span class="pred">${t.predecessor?(t.predecessor+(t.type==='SS'?' SS':'')):'-'}</span>`;
    tl.appendChild(r);
  });

  const ca = document.createElement('div'); ca.className='chart-area';
  const monthRow = document.createElement('div'); monthRow.className='ch-month-row';
  let curMonth = -1, monthSpan = null;
  allDays.forEach(d=>{
    if(d.getMonth() !== curMonth){
      if(monthSpan) monthRow.appendChild(monthSpan);
      monthSpan = document.createElement('div');
      monthSpan.className='ch-month';
      monthSpan.textContent = MONTHS_PT[d.getMonth()]+' '+d.getFullYear();
      monthSpan.style.minWidth = COL_W+'px';
      curMonth = d.getMonth();
    } else {
      monthSpan.style.minWidth = (parseInt(monthSpan.style.minWidth)+COL_W)+'px';
    }
  });
  monthRow.appendChild(monthSpan);
  ca.appendChild(monthRow);

  const dh = document.createElement('div'); dh.className='ch-header';
  const today = new Date(); today.setHours(0,0,0,0);
  allDays.forEach(d=>{
    const cell=document.createElement('div'); cell.className='ch-day';
    if(isWeekend(d)) cell.classList.add('weekend');
    if(d.getTime()===today.getTime()) cell.classList.add('today');
    cell.innerHTML=`<span>${DAYS_PT[d.getDay()].charAt(0)}</span><span>${d.getDate()}</span>`;
    dh.appendChild(cell);
  });
  ca.appendChild(dh);

  const rowsContainer = document.createElement('div'); rowsContainer.style.position='relative';

  tasks.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='ch-row';
    allDays.forEach(d=>{
      const c=document.createElement('div'); c.className='ch-cell';
      if(isWeekend(d)) c.classList.add('weekend');
      row.appendChild(c);
    });

    const startIdx = businessDayIndex(t.start, allDays[0]);
    
    if(t.duration === 0) {
      // Milestone (Losango)
      const ms = document.createElement('div');
      ms.className = 'milestone';
      ms.style.left = (startIdx * COL_W + COL_W/2 - 9) + 'px';
      ms.dataset.idx = i;
      ms.addEventListener('mouseenter', showTooltip);
      ms.addEventListener('mouseleave', hideTooltip);
      row.appendChild(ms);
    } else {
      // Barra normal
      const endIdx = businessDayIndex(t.end, allDays[0]);
      const bar = document.createElement('div'); bar.className='bar';
      bar.style.left = (startIdx * COL_W + 2) + 'px';
      bar.style.width = ((endIdx - startIdx + 1) * COL_W - 4) + 'px';
      const progress = document.createElement('div');
      progress.className = 'bar-progress';
      progress.style.width = t.percent + '%';
      progress.style.background = BAR_COLORS[i % BAR_COLORS.length];
      bar.appendChild(progress);
      bar.innerHTML += `<span class="bar-label">${t.percent}%</span>`;
      bar.dataset.idx = i;
      bar.addEventListener('mouseenter', showTooltip);
      bar.addEventListener('mouseleave', hideTooltip);
      row.appendChild(bar);
    }
    rowsContainer.appendChild(row);
  });

  // SVG para Setas
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.classList.add('dep-svg');
  svg.setAttribute('width', allDays.length * COL_W);
  svg.setAttribute('height', tasks.length * ROW_H);
  
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
  marker.setAttribute('id','arrow'); marker.setAttribute('viewBox','0 0 10 10');
  marker.setAttribute('refX','8'); marker.setAttribute('refY','5');
  marker.setAttribute('markerWidth','6'); marker.setAttribute('markerHeight','6');
  marker.setAttribute('orient','auto-start-reverse');
  const poly = document.createElementNS('http://www.w3.org/2000/svg','path');
  poly.setAttribute('d','M 0 0 L 10 5 L 0 10 z'); poly.setAttribute('fill','#6c5ce7');
  marker.appendChild(poly); defs.appendChild(marker); svg.appendChild(defs);
  svg.appendChild(defs);

  tasks.forEach((t,i)=>{
    if(!t.predecessor) return;
    const predIdx = tasks.findIndex(x=>x.id===parseInt(t.predecessor));
    if(predIdx<0) return;
    const pred = tasks[predIdx];
    const predX = t.type==='SS' ? businessDayIndex(pred.start, allDays[0])*COL_W + 5 : (businessDayIndex(pred.end, allDays[0])+1)*COL_W - 5;
    const tX = businessDayIndex(t.start, allDays[0])*COL_W + 2;
    
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const y1 = predIdx * ROW_H + ROW_H/2, y2 = i * ROW_H + ROW_H/2;
    path.setAttribute('d',`M${predX},${y1} C${predX+15},${y1} ${tX-15},${y2} ${tX},${y2}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke','#6c5ce7');
    path.setAttribute('stroke-width','1.5'); path.setAttribute('marker-end','url(#arrow)');
    path.setAttribute('opacity','0.4');
    svg.appendChild(path);
  });
  rowsContainer.appendChild(svg);

  if(today >= allDays[0] && today <= allDays[allDays.length-1]){
    const line = document.createElement('div'); line.className='today-line';
    line.style.left = (businessDayIndex(today, allDays[0])*COL_W + COL_W/2)+'px';
    line.style.height = (tasks.length*ROW_H)+'px';
    rowsContainer.appendChild(line);
  }

  ca.appendChild(rowsContainer);
  wrapper.appendChild(tl);
  wrapper.appendChild(ca);
}

function showTooltip(e){
  const t = tasks[e.target.dataset.idx];
  const tip = document.getElementById('tooltip');
  tip.innerHTML=`<h4>${t.task}</h4>
    <div class="tt-row"><p>Tipo:</p><span class="tt-val">${t.duration === 0 ? 'Marco (Milestone)' : 'Tarefa'}</span></div>
    <div class="tt-row"><p>Início:</p><span class="tt-val">${fmtDate(t.start)}</span></div>
    <div class="tt-row"><p>Fim:</p><span class="tt-val">${fmtDate(t.end)}</span></div>
    <div class="tt-row"><p>Duração:</p><span class="tt-val">${t.duration} dias</span></div>`;
  tip.style.display='block';
  tip.style.left = (e.clientX+16)+'px'; tip.style.top = (e.clientY-10)+'px';
}
function hideTooltip(){ document.getElementById('tooltip').style.display='none'; }

async function loadCSV(src){
  tasks = parseCSV(src);
  if(!tasks.length) return;
  projectStart = parseDate(document.getElementById('startDate').value) || new Date();
  calculateSchedule(tasks, projectStart);
  allDays = buildCalendar(tasks);
  render();
}

function reload(){
  if(fileContent) loadCSV(fileContent);
}

document.getElementById('csvFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ev=>{ fileContent=ev.target.result; loadCSV(fileContent); };
  reader.readAsText(f);
});

document.getElementById('startDate').addEventListener('change', reload);
</script>
</body>
</html>
